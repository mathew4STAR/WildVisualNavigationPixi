[workspace]
name = "wild_visual_navigation"
version = "0.1.0"
description = "WVN with RoboStack and Pixi for Jetson"
authors = ["AirLagx1 <airlagx1@example.com>"]
channels = ["conda-forge", "robostack-staging"]
platforms = ["linux-aarch64"]

[environments]
ml = ["ml-deps"]
sim = ["sim-deps"]

# -----------------
# ML ENVIRONMENT
# -----------------
[feature.ml-deps.dependencies]
python = "3.10.*"
compilers = "*"
cmake = "*"
pkg-config = "*"
pip = "*"
cython = "*"
setuptools = "<82"
numpy = "*"
scipy = "*"
scikit-learn = "*"
scikit-image = "*"
matplotlib = "*"
pandas = "*"
opencv = "*"
openblas = "*"
openmpi = "*"

[feature.ml-deps.pypi-options]
extra-index-urls = ["https://pypi.jetson-ai-lab.io/jp6/cu126", "https://rospypi.github.io/simple/"]
index-strategy = "unsafe-best-match"
no-build-isolation = ["fast-slic"]

[feature.ml-deps.activation]
scripts = ["ml_env_setup.sh"]

[feature.ml-deps.pypi-dependencies]
# PyPI ML Dependencies
nvidia-cudss-cu12 = "*"
nvidia-cusparselt-cu12 = "*"
torch = { url = "https://pypi.jetson-ai-lab.io/jp6/cu126/+f/46b/b8b13f844b211/torch-2.11.0-cp310-cp310-linux_aarch64.whl" }
torchvision = { url = "https://pypi.jetson-ai-lab.io/jp6/cu126/+f/d11/6f08d3d62417d/torchvision-0.26.0-cp310-cp310-linux_aarch64.whl" }
torchmetrics = "*"
pytorch-lightning = ">=1.6.5"
torch-geometric = "*"
tqdm = "*"
kornia = ">=0.6.5"
pytest = "*"
seaborn = "*"
pytictac = "*"
omegaconf = "*"
optuna = "*"
neptune = "*"
fast-slic = "*"
hydra-core = "*"
prettytable = "*"
termcolor = "*"
wget = "*"
wandb = "*"
gdown = "*"
jupyter = "*"
black = "*"
flake8 = "*"

# Pure-Python ROS 1 (via rospypi)
rospy = "*"
rospkg = "*"
std-msgs = "*"
sensor-msgs = "*"
geometry-msgs = "*"
nav-msgs = "*"

# C++ Source Extensions
pydensecrf = { git = "https://github.com/lucasb-eyer/pydensecrf.git" }
liegroups = { git = "https://github.com/mmattamala/liegroups" }

# Local Editable Installs
wild_visual_navigation = { path = "./src/wild_visual_navigation", editable = true }
stego = { path = "./src/self_supervised_segmentation", editable = true }

[feature.ml-deps.tasks]
launch-ml = "python src/wild_visual_navigation/wild_visual_navigation_ros/scripts/wvn_feature_extractor_node.py"

# -----------------
# SIM ENVIRONMENT
# -----------------
[feature.sim-deps.dependencies]
python = "3.12.*"
catkin_tools = "*"
ros-noetic-desktop = "*"
ros-noetic-rospy = "*"
ros-noetic-nav-msgs = "*"
ros-noetic-sensor-msgs = "*"
ros-noetic-geometry-msgs = "*"
ros-noetic-std-msgs = "*"
ros-noetic-gazebo-ros-pkgs = "*"
ros-noetic-xacro = "*"
ros-noetic-robot-state-publisher = "*"

[feature.sim-deps.tasks]
build = "catkin build -DPython_FIND_VIRTUALENV=ONLY -DPython3_FIND_VIRTUALENV=ONLY"
launch-sim = "source devel/setup.bash && roslaunch wild_visual_navigation_jackal sim.launch"
