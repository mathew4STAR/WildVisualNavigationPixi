# WVN parameters for the diffbot simulation
# Adapted from default.yaml with correct frames for the diff-drive robot

# Input topics
robot_state_topic: "/wild_visual_navigation_node/robot_state"
desired_twist_topic: "/wild_visual_navigation_node/reference_twist"

# Relevant frames (match diffbot URDF)
fixed_frame: odom
base_frame: base_link
footprint_frame: base_link

# Robot size used to project the footprint
robot_length: 0.4
robot_width: 0.3
robot_height: 0.1

# Traversability estimation parameters
traversability_radius: 3.0
image_graph_dist_thr: 0.2
supervision_graph_dist_thr: 0.1
network_input_image_height: 224
network_input_image_width: 224
segmentation_type: "stego"
feature_type: "stego"
dino_patch_size: 8
dino_backbone: vit_small
slic_num_components: 100
confidence_std_factor: 1.0
min_samples_for_training: 5
prediction_per_pixel: True
vis_node_index: 10

# Supervision Generator
untraversable_thr: 0.0
mission_name: "diffbot_sim"
mission_timestamp: True

# Threads
image_callback_rate: 10
supervision_callback_rate: 10
learning_thread_rate: 10
logging_thread_rate: 2
status_thread_rate: 0.5
load_save_checkpoint_rate: 1.0

# Runtime options
device: "cuda"
mode: "online"
colormap: "RdYlBu"

print_image_callback_time: false
print_supervision_callback_time: false
log_time: false
log_confidence: false
verbose: true
extraction_store_folder: "nan"
